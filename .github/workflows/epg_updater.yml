name: Actualizador de EPG Japan Motion

on:
  schedule:
    # Se ejecuta automáticamente cada 3 horas (minuto 0)
    - cron: '0 */3 * * *'
  # Mantiene la opción de ejecutarlo manualmente cuando quieras
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 gspread google-auth
          playwright install chromium
          playwright install-deps

      - name: Ejecutar script de actualización
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python update_epg.py
